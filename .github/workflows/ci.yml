name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Windows · .NET 10
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Nekomata/Nekomata.sln

      - name: Build
        run: dotnet build Nekomata/Nekomata.sln --configuration Release --no-restore --maxcpucount:1 /p:UseSharedCompilation=false

      - name: Test
        run: dotnet test Nekomata/Nekomata.Tests/Nekomata.Tests.csproj --configuration Release --no-build --no-restore --maxcpucount:1 /p:UseSharedCompilation=false --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: Nekomata/Nekomata.Tests/TestResults/tests.trx
          if-no-files-found: ignore
